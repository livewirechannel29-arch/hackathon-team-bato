# =============================================================
# Northwind Logistics — Strangler Fig Proxy
#
# This is the migration control plane. Both apps run simultaneously
# against the same database. Uncomment a location block to hand
# a route to the modern app. The legacy app never knows.
# =============================================================

upstream legacy {
    server legacy:80;
}

upstream modern {
    server modern:8080;
}

server {
    listen 80;
    server_name _;

    # ------------------------------------------------------------------
    # Routes MIGRATED to the modern app.
    # Uncomment each block as you finish extracting the route.
    # ------------------------------------------------------------------

    location ~ ^/api/orders(/|$) {
        proxy_pass         http://modern;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    }

    # location ~ ^/api/customers(/|$) { proxy_pass http://modern; }
    # location ~ ^/api/products(/|$)  { proxy_pass http://modern; }
    # location ~ ^/api/reports(/|$)   { proxy_pass http://modern; }

    # ------------------------------------------------------------------
    # Everything else → legacy PHP 5 app (untouched, still running)
    # ------------------------------------------------------------------

    location / {
        proxy_pass         http://legacy;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   Cookie           $http_cookie;
    }
}
