<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Northwind Logistics</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1a202c;
      --muted: #718096;
      --accent: #3b82f6;
      --accent-dark: #2563eb;
      --shipped: #10b981;
      --pending: #f59e0b;
      --cancelled: #ef4444;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
      --shadow-lg: 0 10px 25px rgba(0,0,0,.12);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 18px; height: 18px; fill: white; }
    header h1 { font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
    header span { font-size: 13px; color: var(--muted); margin-left: 4px; }

    /* ── Main layout ── */
    main { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .stat-value { font-size: 26px; font-weight: 700; }
    .stat-value.shipped { color: var(--shipped); }
    .stat-value.pending { color: var(--pending); }
    .stat-value.cancelled { color: var(--cancelled); }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .toolbar input, .toolbar select {
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 12px;
      font-size: 14px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    .toolbar input { width: 240px; }
    .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
    .toolbar select { padding-right: 28px; cursor: pointer; }
    .result-count { font-size: 13px; color: var(--muted); margin-left: auto; }

    /* ── Table ── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead { background: #f8fafc; }
    th {
      padding: 11px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td { padding: 13px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { cursor: pointer; transition: background .1s; }
    tbody tr:hover { background: #f8fafc; }
    tbody tr.active { background: #eff6ff; }

    .order-id { font-weight: 600; color: var(--accent); }
    .company { font-weight: 500; }
    .date { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .total { font-weight: 600; }
    .items-count { color: var(--muted); font-size: 13px; }

    /* ── Status badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize;
    }
    .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
    .badge.shipped  { background: #d1fae5; color: #065f46; }
    .badge.shipped::before  { background: var(--shipped); }
    .badge.pending  { background: #fef3c7; color: #92400e; }
    .badge.pending::before  { background: var(--pending); }
    .badge.cancelled { background: #fee2e2; color: #991b1b; }
    .badge.cancelled::before { background: var(--cancelled); }

    /* ── Empty / loading ── */
    .placeholder {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .placeholder svg { width: 40px; height: 40px; margin-bottom: 12px; opacity: .4; }
    .placeholder p { font-size: 15px; }

    /* ── Detail panel ── */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 100;
    }
    .overlay.open { display: block; }
    .panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 440px;
      max-width: 100vw;
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform .25s ease;
      z-index: 101;
    }
    .panel.open { transform: translateX(0); }

    .panel-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      position: sticky; top: 0;
      background: var(--surface);
    }
    .panel-header h2 { font-size: 17px; font-weight: 700; }
    .panel-header .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .close-btn {
      width: 30px; height: 30px;
      border: none; background: none;
      cursor: pointer;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      flex-shrink: 0;
      transition: background .1s;
    }
    .close-btn:hover { background: var(--bg); color: var(--text); }

    .panel-body { padding: 20px 24px; }

    .section { margin-bottom: 24px; }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 16px;
    }
    .info-item label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 2px; }
    .info-item span { font-size: 14px; font-weight: 500; }

    .note-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      color: #92400e;
    }

    .items-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .items-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .items-table td { padding: 9px 0; border-bottom: 1px solid var(--border); }
    .items-table tr:last-child td { border-bottom: none; }
    .items-table .right { text-align: right; }
    .items-total {
      display: flex;
      justify-content: space-between;
      padding-top: 12px;
      font-weight: 700;
      font-size: 15px;
      border-top: 2px solid var(--border);
    }

    .loading-spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      margin: 60px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 700px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .panel { width: 100vw; }
      .toolbar input { width: 100%; }
      th:nth-child(3), td:nth-child(3),
      th:nth-child(5), td:nth-child(5) { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
  </div>
  <h1>Northwind Logistics</h1>
  <span>Orders</span>
</header>

<main>
  <div class="stats">
    <div class="stat">
      <div class="stat-label">Total Orders</div>
      <div class="stat-value" id="stat-total">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Pending</div>
      <div class="stat-value pending" id="stat-pending">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Shipped</div>
      <div class="stat-value shipped" id="stat-shipped">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Cancelled</div>
      <div class="stat-value cancelled" id="stat-cancelled">—</div>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Search customer…" />
    <select id="filter-status">
      <option value="">All statuses</option>
      <option value="pending">Pending</option>
      <option value="shipped">Shipped</option>
      <option value="cancelled">Cancelled</option>
    </select>
    <span class="result-count" id="result-count"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Customer</th>
          <th>Handler</th>
          <th>Order Date</th>
          <th>Ship Date</th>
          <th>Items</th>
          <th>Total</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<!-- Detail panel -->
<div class="overlay" id="overlay"></div>
<aside class="panel" id="panel">
  <div class="panel-header">
    <div>
      <h2 id="panel-title">Order #—</h2>
      <div class="sub" id="panel-sub"></div>
    </div>
    <button class="close-btn" id="close-btn" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
  <div class="panel-body" id="panel-body">
    <div class="loading-spinner"></div>
  </div>
</aside>

<script>
  const tbody = document.getElementById('tbody');
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  const closeBtn = document.getElementById('close-btn');

  let allOrders = [];
  let activeRow = null;

  // ── Fetch all orders ──────────────────────────────────────────────────────
  async function loadOrders() {
    tbody.innerHTML = `<tr><td colspan="8"><div class="loading-spinner"></div></td></tr>`;
    try {
      const res = await fetch('/api/orders');
      const json = await res.json();
      allOrders = json.data;
      updateStats(allOrders);
      render(allOrders);
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="placeholder"><p>Failed to load orders.</p></div></td></tr>`;
    }
  }

  // ── Stats ─────────────────────────────────────────────────────────────────
  function updateStats(orders) {
    document.getElementById('stat-total').textContent = orders.length;
    document.getElementById('stat-pending').textContent   = orders.filter(o => o.status === 'pending').length;
    document.getElementById('stat-shipped').textContent   = orders.filter(o => o.status === 'shipped').length;
    document.getElementById('stat-cancelled').textContent = orders.filter(o => o.status === 'cancelled').length;
  }

  // ── Render table ──────────────────────────────────────────────────────────
  function render(orders) {
    document.getElementById('result-count').textContent =
      orders.length === allOrders.length ? `${orders.length} orders` : `${orders.length} of ${allOrders.length} orders`;

    if (!orders.length) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="placeholder">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4z"/></svg>
        <p>No orders found</p></div></td></tr>`;
      return;
    }

    tbody.innerHTML = orders.map(o => `
      <tr data-id="${o.order_id}">
        <td><span class="order-id">#${o.order_id}</span></td>
        <td><span class="company">${esc(o.company_name)}</span></td>
        <td class="date">${esc(o.first_name)} ${esc(o.last_name)}</td>
        <td class="date">${fmtDate(o.order_date)}</td>
        <td class="date">${o.ship_date ? fmtDate(o.ship_date) : '<span style="color:var(--muted)">—</span>'}</td>
        <td class="items-count">${o.item_count}</td>
        <td class="total">$${Number(o.total).toFixed(2)}</td>
        <td><span class="badge ${o.status}">${o.status}</span></td>
      </tr>`).join('');

    tbody.querySelectorAll('tr').forEach(tr => {
      tr.addEventListener('click', () => openPanel(Number(tr.dataset.id), tr));
    });
  }

  // ── Filters ───────────────────────────────────────────────────────────────
  function applyFilters() {
    const q      = document.getElementById('search').value.toLowerCase().trim();
    const status = document.getElementById('filter-status').value;
    const filtered = allOrders.filter(o =>
      (!status || o.status === status) &&
      (!q || o.company_name.toLowerCase().includes(q))
    );
    render(filtered);
  }

  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('filter-status').addEventListener('change', applyFilters);

  // ── Detail panel ──────────────────────────────────────────────────────────
  async function openPanel(id, row) {
    if (activeRow) activeRow.classList.remove('active');
    activeRow = row;
    row.classList.add('active');

    document.getElementById('panel-title').textContent = `Order #${id}`;
    document.getElementById('panel-sub').textContent = '';
    document.getElementById('panel-body').innerHTML = `<div class="loading-spinner"></div>`;
    overlay.classList.add('open');
    panel.classList.add('open');

    try {
      const res = await fetch(`/api/orders/${id}`);
      const o = await res.json();
      renderPanel(o);
    } catch {
      document.getElementById('panel-body').innerHTML = `<p style="color:var(--cancelled)">Failed to load order details.</p>`;
    }
  }

  function renderPanel(o) {
    document.getElementById('panel-sub').innerHTML =
      `<span class="badge ${o.status}" style="font-size:11px">${o.status}</span>`;

    const total = (o.items || []).reduce((s, i) => s + i.quantity * i.unit_price, 0);

    document.getElementById('panel-body').innerHTML = `
      <div class="section">
        <div class="section-title">Customer</div>
        <div class="info-grid">
          <div class="info-item"><label>Company</label><span>${esc(o.company_name)}</span></div>
          <div class="info-item"><label>Contact</label><span>${esc(o.contact_name || '—')}</span></div>
          <div class="info-item"><label>Email</label><span>${esc(o.email || '—')}</span></div>
          <div class="info-item"><label>Phone</label><span>${esc(o.phone || '—')}</span></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Order Info</div>
        <div class="info-grid">
          <div class="info-item"><label>Order Date</label><span>${fmtDate(o.order_date)}</span></div>
          <div class="info-item"><label>Ship Date</label><span>${o.ship_date ? fmtDate(o.ship_date) : '—'}</span></div>
          <div class="info-item"><label>Handler</label><span>${esc(o.first_name)} ${esc(o.last_name)}</span></div>
        </div>
      </div>

      ${o.note ? `<div class="section"><div class="section-title">Note</div><div class="note-box">${esc(o.note)}</div></div>` : ''}

      <div class="section">
        <div class="section-title">Items</div>
        <table class="items-table">
          <thead>
            <tr>
              <th>Product</th>
              <th class="right">Qty</th>
              <th class="right">Unit Price</th>
              <th class="right">Subtotal</th>
            </tr>
          </thead>
          <tbody>
            ${(o.items || []).map(i => `
              <tr>
                <td>${esc(i.product_name)}</td>
                <td class="right">${i.quantity}</td>
                <td class="right">$${Number(i.unit_price).toFixed(2)}</td>
                <td class="right">$${(i.quantity * i.unit_price).toFixed(2)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
        <div class="items-total"><span>Total</span><span>$${total.toFixed(2)}</span></div>
      </div>`;
  }

  function closePanel() {
    overlay.classList.remove('open');
    panel.classList.remove('open');
    if (activeRow) { activeRow.classList.remove('active'); activeRow = null; }
  }

  closeBtn.addEventListener('click', closePanel);
  overlay.addEventListener('click', closePanel);

  // ── Helpers ───────────────────────────────────────────────────────────────
  function fmtDate(s) {
    if (!s) return '—';
    const d = new Date(s);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  loadOrders();
</script>
</body>
</html>
