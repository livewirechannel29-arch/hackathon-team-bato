<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Northwind Logistics</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1a202c;
      --muted: #718096;
      --accent: #3b82f6;
      --accent-dark: #2563eb;
      --shipped: #10b981;
      --pending: #f59e0b;
      --cancelled: #ef4444;
      --nav-bg: #1e3a5f;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.08);
      --shadow-lg: 0 10px 25px rgba(0,0,0,.12);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Nav bar ── */
    nav {
      background: var(--nav-bg);
      padding: 0 24px;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .nav-brand {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin-right: 16px;
      white-space: nowrap;
    }
    .nav-sep { color: rgba(255,255,255,.3); margin-right: 16px; }
    .nav-links { display: flex; gap: 2px; flex: 1; }
    .nav-link {
      color: rgba(255,255,255,.75);
      text-decoration: none;
      font-size: 13px;
      padding: 0 12px;
      height: 44px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }
    .nav-link:hover { color: #fff; }
    .nav-link.active { color: #fff; border-bottom-color: #60a5fa; }
    .nav-link.disabled { opacity: .4; cursor: default; pointer-events: none; }
    .nav-user {
      font-size: 13px;
      color: rgba(255,255,255,.8);
      margin-left: auto;
      white-space: nowrap;
    }
    .nav-user strong { color: #fff; }

    /* ── Main layout ── */
    main { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .stat-value { font-size: 26px; font-weight: 700; }
    .stat-value.shipped  { color: var(--shipped); }
    .stat-value.pending  { color: var(--pending); }
    .stat-value.cancelled { color: var(--cancelled); }

    /* ── Page heading + filter links ── */
    .page-header { margin-bottom: 16px; }
    .page-header h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .filter-links { display: flex; gap: 4px; align-items: center; font-size: 13px; }
    .filter-links span { color: var(--muted); }
    .filter-link {
      color: var(--accent);
      text-decoration: none;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background .1s;
      cursor: pointer;
    }
    .filter-link:hover { background: #eff6ff; }
    .filter-link.active { color: var(--text); font-weight: 600; text-decoration: none; }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .toolbar input {
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 12px;
      font-size: 13px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      width: 220px;
      transition: border-color .15s;
    }
    .toolbar input:focus { border-color: var(--accent); }
    .result-count { font-size: 13px; color: var(--muted); margin-left: auto; }

    /* ── Table ── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead { background: #f0f4f8; }
    th {
      padding: 10px 14px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .1s; }
    tbody tr:hover { background: #f8fafc; }
    tbody tr.active { background: #eff6ff; }

    .order-id { font-weight: 600; }
    .customer-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .customer-link:hover { text-decoration: underline; }
    .date { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .total { font-weight: 600; }
    .items-count { color: var(--muted); }
    .view-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .view-link:hover { text-decoration: underline; }

    /* ── Status ── */
    .status-shipped  { color: var(--shipped); font-weight: 700; }
    .status-pending  { color: var(--pending); font-weight: 700; }
    .status-cancelled { color: var(--cancelled); font-weight: 700; }

    /* ── Empty / loading ── */
    .placeholder {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 15px;
    }

    /* ── Detail panel ── */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 100;
    }
    .overlay.open { display: block; }
    .panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 460px;
      max-width: 100vw;
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform .25s ease;
      z-index: 101;
    }
    .panel.open { transform: translateX(0); }

    .panel-header {
      background: var(--nav-bg);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky; top: 0;
    }
    .panel-header h2 { font-size: 16px; font-weight: 700; color: #fff; }
    .panel-header .badge { font-size: 11px; }
    .close-btn {
      width: 28px; height: 28px;
      border: none; background: rgba(255,255,255,.15);
      cursor: pointer;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      flex-shrink: 0;
      transition: background .1s;
    }
    .close-btn:hover { background: rgba(255,255,255,.25); }

    .panel-body { padding: 20px; }

    .section { margin-bottom: 22px; }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 16px;
    }
    .info-item label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 2px; }
    .info-item span { font-size: 14px; font-weight: 500; }

    .note-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      color: #92400e;
    }

    .items-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .items-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .items-table td { padding: 9px 0; border-bottom: 1px solid var(--border); }
    .items-table tr:last-child td { border-bottom: none; }
    .items-table .right { text-align: right; }
    .items-total {
      display: flex;
      justify-content: space-between;
      padding-top: 12px;
      font-weight: 700;
      font-size: 15px;
      border-top: 2px solid var(--border);
      margin-top: 4px;
    }

    .loading-spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      margin: 60px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Badge ── */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 99px;
      font-size: 12px; font-weight: 600; text-transform: capitalize;
    }
    .badge::before { content:''; width:6px; height:6px; border-radius:50%; }
    .badge.shipped   { background:#d1fae5; color:#065f46; }
    .badge.shipped::before   { background:var(--shipped); }
    .badge.pending   { background:#fef3c7; color:#92400e; }
    .badge.pending::before   { background:var(--pending); }
    .badge.cancelled { background:#fee2e2; color:#991b1b; }
    .badge.cancelled::before { background:var(--cancelled); }

    @media (max-width: 700px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .panel { width: 100vw; }
      .toolbar input { width: 100%; }
      th:nth-child(5), td:nth-child(5) { display: none; }
    }
  </style>
</head>
<body>

<nav>
  <span class="nav-brand">Northwind Logistics</span>
  <span class="nav-sep">|</span>
  <div class="nav-links">
    <a class="nav-link active" href="#">Orders</a>
    <a class="nav-link disabled" href="#">Customers</a>
    <a class="nav-link disabled" href="#">Products</a>
    <a class="nav-link disabled" href="#">Reports</a>
  </div>
  <span class="nav-user">logged in as <strong>Gary Chen</strong></span>
</nav>

<main>
  <div class="stats">
    <div class="stat">
      <div class="stat-label">Total Orders</div>
      <div class="stat-value" id="stat-total">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Pending</div>
      <div class="stat-value pending" id="stat-pending">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Shipped</div>
      <div class="stat-value shipped" id="stat-shipped">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Cancelled</div>
      <div class="stat-value cancelled" id="stat-cancelled">—</div>
    </div>
  </div>

  <div class="page-header">
    <h1>Orders</h1>
    <div class="filter-links">
      <span>Filter:</span>
      <span class="filter-link active" data-status="">All</span>
      <span class="nav-sep">|</span>
      <span class="filter-link" data-status="pending">Pending</span>
      <span class="nav-sep">|</span>
      <span class="filter-link" data-status="shipped">Shipped</span>
      <span class="nav-sep">|</span>
      <span class="filter-link" data-status="cancelled">Cancelled</span>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Search customer…" />
    <span class="result-count" id="result-count"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Customer</th>
          <th>Handler</th>
          <th>Order Date</th>
          <th>Ship Date</th>
          <th>Items</th>
          <th>Total</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<!-- Detail panel -->
<div class="overlay" id="overlay"></div>
<aside class="panel" id="panel">
  <div class="panel-header">
    <div style="display:flex;align-items:center;gap:10px">
      <h2 id="panel-title">Order #—</h2>
      <span id="panel-badge"></span>
    </div>
    <button class="close-btn" id="close-btn" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
  <div class="panel-body" id="panel-body">
    <div class="loading-spinner"></div>
  </div>
</aside>

<script>
  const tbody   = document.getElementById('tbody');
  const overlay = document.getElementById('overlay');
  const panel   = document.getElementById('panel');
  const closeBtn = document.getElementById('close-btn');

  let allOrders  = [];
  let activeRow  = null;
  let activeStatus = '';

  // ── Load ──────────────────────────────────────────────────────────────────
  async function loadOrders() {
    tbody.innerHTML = `<tr><td colspan="9"><div class="loading-spinner"></div></td></tr>`;
    try {
      const res  = await fetch('/api/orders');
      const json = await res.json();
      allOrders  = json.data;
      updateStats(allOrders);
      render(filtered());
    } catch {
      tbody.innerHTML = `<tr><td colspan="9"><div class="placeholder">Failed to load orders.</div></td></tr>`;
    }
  }

  // ── Stats ─────────────────────────────────────────────────────────────────
  function updateStats(orders) {
    document.getElementById('stat-total').textContent     = orders.length;
    document.getElementById('stat-pending').textContent   = orders.filter(o => o.status === 'pending').length;
    document.getElementById('stat-shipped').textContent   = orders.filter(o => o.status === 'shipped').length;
    document.getElementById('stat-cancelled').textContent = orders.filter(o => o.status === 'cancelled').length;
  }

  // ── Filter ────────────────────────────────────────────────────────────────
  function filtered() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    return allOrders.filter(o =>
      (!activeStatus || o.status === activeStatus) &&
      (!q || o.company_name.toLowerCase().includes(q))
    );
  }

  document.querySelectorAll('.filter-link').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.filter-link').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      activeStatus = el.dataset.status;
      render(filtered());
    });
  });

  document.getElementById('search').addEventListener('input', () => render(filtered()));

  // ── Render ────────────────────────────────────────────────────────────────
  function render(orders) {
    document.getElementById('result-count').textContent =
      orders.length === allOrders.length
        ? `${orders.length} orders`
        : `${orders.length} of ${allOrders.length} orders`;

    if (!orders.length) {
      tbody.innerHTML = `<tr><td colspan="9"><div class="placeholder">No orders found.</div></td></tr>`;
      return;
    }

    tbody.innerHTML = orders.map(o => `
      <tr data-id="${o.order_id}">
        <td class="order-id">${o.order_id}</td>
        <td><a class="customer-link" href="#">${esc(o.company_name)}</a></td>
        <td>${esc(o.first_name)} ${esc(o.last_name)}</td>
        <td class="date">${fmtDate(o.order_date)}</td>
        <td class="date">${o.ship_date ? fmtDate(o.ship_date) : '—'}</td>
        <td class="items-count">${o.item_count}</td>
        <td class="total">$${Number(o.total).toFixed(2)}</td>
        <td><span class="status-${o.status}" style="text-transform:capitalize">${o.status.charAt(0).toUpperCase()+o.status.slice(1)}</span></td>
        <td><span class="view-link">View</span></td>
      </tr>`).join('');

    tbody.querySelectorAll('tr').forEach(tr => {
      tr.querySelector('.view-link').addEventListener('click', e => {
        e.stopPropagation();
        openPanel(Number(tr.dataset.id), tr);
      });
      tr.addEventListener('click', () => openPanel(Number(tr.dataset.id), tr));
    });
  }

  // ── Detail panel ──────────────────────────────────────────────────────────
  async function openPanel(id, row) {
    if (activeRow) activeRow.classList.remove('active');
    activeRow = row;
    row.classList.add('active');

    document.getElementById('panel-title').textContent = `Order #${id}`;
    document.getElementById('panel-badge').innerHTML = '';
    document.getElementById('panel-body').innerHTML = `<div class="loading-spinner"></div>`;
    overlay.classList.add('open');
    panel.classList.add('open');

    try {
      const res = await fetch(`/api/orders/${id}`);
      const o   = await res.json();
      document.getElementById('panel-badge').innerHTML =
        `<span class="badge ${o.status}">${o.status}</span>`;
      renderPanel(o);
    } catch {
      document.getElementById('panel-body').innerHTML = `<p style="color:var(--cancelled);padding:20px">Failed to load order details.</p>`;
    }
  }

  function renderPanel(o) {
    const total = (o.items || []).reduce((s, i) => s + i.quantity * i.unit_price, 0);

    document.getElementById('panel-body').innerHTML = `
      <div class="section">
        <div class="section-title">Customer</div>
        <div class="info-grid">
          <div class="info-item"><label>Company</label><span>${esc(o.company_name)}</span></div>
          <div class="info-item"><label>Contact</label><span>${esc(o.contact_name || '—')}</span></div>
          <div class="info-item"><label>Email</label><span>${esc(o.email || '—')}</span></div>
          <div class="info-item"><label>Phone</label><span>${esc(o.phone || '—')}</span></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Order Info</div>
        <div class="info-grid">
          <div class="info-item"><label>Order Date</label><span>${fmtDate(o.order_date)}</span></div>
          <div class="info-item"><label>Ship Date</label><span>${o.ship_date ? fmtDate(o.ship_date) : '—'}</span></div>
          <div class="info-item"><label>Handler</label><span>${esc(o.first_name)} ${esc(o.last_name)}</span></div>
          <div class="info-item"><label>Status</label><span class="status-${o.status}" style="text-transform:capitalize">${o.status}</span></div>
        </div>
      </div>

      ${o.note ? `<div class="section"><div class="section-title">Note</div><div class="note-box">${esc(o.note)}</div></div>` : ''}

      <div class="section">
        <div class="section-title">Items</div>
        <table class="items-table">
          <thead>
            <tr>
              <th>Product</th>
              <th class="right">Qty</th>
              <th class="right">Unit Price</th>
              <th class="right">Subtotal</th>
            </tr>
          </thead>
          <tbody>
            ${(o.items || []).map(i => `
              <tr>
                <td>${esc(i.product_name)}</td>
                <td class="right">${i.quantity}</td>
                <td class="right">$${Number(i.unit_price).toFixed(2)}</td>
                <td class="right">$${(i.quantity * i.unit_price).toFixed(2)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
        <div class="items-total"><span>Total</span><span>$${total.toFixed(2)}</span></div>
      </div>`;
  }

  function closePanel() {
    overlay.classList.remove('open');
    panel.classList.remove('open');
    if (activeRow) { activeRow.classList.remove('active'); activeRow = null; }
  }

  closeBtn.addEventListener('click', closePanel);
  overlay.addEventListener('click', closePanel);

  // ── Helpers ───────────────────────────────────────────────────────────────
  function fmtDate(s) {
    if (!s) return '—';
    return new Date(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  loadOrders();
</script>
</body>
</html>
