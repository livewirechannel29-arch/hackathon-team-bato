<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — Northwind Logistics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f6f9; --surface: #ffffff; --border: #e2e8f0;
      --text: #1a202c; --muted: #718096; --accent: #3b82f6;
      --shipped: #10b981; --pending: #f59e0b; --cancelled: #ef4444;
      --nav-bg: #1e3a5f; --radius: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    nav { background: var(--nav-bg); padding: 0 24px; height: 44px; display: flex; align-items: center; position: sticky; top: 0; z-index: 10; }
    .nav-brand { font-size: 15px; font-weight: 700; color: #fff; margin-right: 16px; }
    .nav-sep { color: rgba(255,255,255,.3); margin-right: 16px; }
    .nav-links { display: flex; gap: 2px; flex: 1; }
    .nav-link { color: rgba(255,255,255,.75); text-decoration: none; font-size: 13px; padding: 0 12px; height: 44px; display: flex; align-items: center; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
    .nav-link:hover { color: #fff; }
    .nav-link.active { color: #fff; border-bottom-color: #60a5fa; }
    .nav-user { font-size: 13px; color: rgba(255,255,255,.8); margin-left: auto; }
    .nav-user strong { color: #fff; }

    main { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }
    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 22px; font-weight: 700; }

    /* ── Summary cards ── */
    .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
    .card-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .card-value { font-size: 26px; font-weight: 700; }
    .card-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .card-value.green  { color: var(--shipped); }
    .card-value.amber  { color: var(--pending); }
    .card-value.red    { color: var(--cancelled); }
    .card-value.blue   { color: var(--accent); }

    /* ── Grid layout ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .grid-3 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .panel-head { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .panel-head h2 { font-size: 14px; font-weight: 700; }
    .panel-head .sub { font-size: 12px; color: var(--muted); }
    .panel-body { padding: 20px; }
    .chart-wrap { position: relative; }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    .rank { color: var(--muted); font-weight: 600; font-size: 12px; }
    .bold { font-weight: 600; }
    .right { text-align: right; }
    .bar-cell { min-width: 100px; }
    .bar-bg { background: #e2e8f0; border-radius: 99px; height: 6px; overflow: hidden; }
    .bar-fill { height: 6px; border-radius: 99px; background: var(--accent); }
    .bar-fill.green { background: var(--shipped); }

    /* ── Status breakdown ── */
    .status-row { display: flex; gap: 12px; flex-direction: column; }
    .status-item { display: flex; align-items: center; gap: 10px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .status-label { font-size: 13px; flex: 1; text-transform: capitalize; }
    .status-count { font-size: 13px; font-weight: 700; }
    .status-pct { font-size: 12px; color: var(--muted); width: 36px; text-align: right; }
    .status-bar-wrap { flex: 1; }

    .loading-spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; margin: 40px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 800px) {
      .summary { grid-template-columns: repeat(2, 1fr); }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav>
  <span class="nav-brand">Northwind Logistics</span>
  <span class="nav-sep">|</span>
  <div class="nav-links">
    <a class="nav-link" href="index.html">Orders</a>
    <a class="nav-link" href="customers.html">Customers</a>
    <a class="nav-link" href="products.html">Products</a>
    <a class="nav-link active" href="reports.html">Reports</a>
  </div>
  <span class="nav-user">logged in as <strong>Gary Chen</strong></span>
</nav>

<main>
  <div class="page-header"><h1>Reports</h1></div>

  <div id="root"><div class="loading-spinner"></div></div>
</main>

<script>
const fmt = n => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtMonth = s => { const [y, m] = s.split('-'); return new Date(y, m - 1).toLocaleString('en-US', { month: 'short', year: 'numeric' }); };
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function load() {
  const res  = await fetch('/api/reports');
  const data = await res.json();
  render(data);
}

function render({ summary, byMonth, topCustomers, topProducts, byCategory }) {
  const total = summary.total_orders || 1;
  const maxSpend   = Math.max(...topCustomers.map(c => c.total_spend), 1);
  const maxRevProd = Math.max(...topProducts.map(p => p.revenue), 1);
  const maxCatRev  = Math.max(...byCategory.map(c => c.revenue), 1);

  document.getElementById('root').innerHTML = `
    <!-- Summary -->
    <div class="summary">
      <div class="card">
        <div class="card-label">Total Revenue</div>
        <div class="card-value">${fmt(summary.total_revenue)}</div>
        <div class="card-sub">${summary.total_orders} orders total</div>
      </div>
      <div class="card">
        <div class="card-label">Avg Order Value</div>
        <div class="card-value blue">${fmt(summary.avg_order_value)}</div>
      </div>
      <div class="card">
        <div class="card-label">Shipped</div>
        <div class="card-value green">${summary.shipped}</div>
        <div class="card-sub">${pct(summary.shipped, total)} of orders</div>
      </div>
      <div class="card">
        <div class="card-label">Pending / Cancelled</div>
        <div class="card-value amber">${summary.pending} <span style="font-size:16px;color:var(--cancelled)">/ ${summary.cancelled}</span></div>
      </div>
    </div>

    <!-- Revenue by month + Status breakdown -->
    <div class="grid-3">
      <div class="panel">
        <div class="panel-head"><h2>Revenue by Month</h2></div>
        <div class="panel-body"><div class="chart-wrap"><canvas id="chart-monthly" height="200"></canvas></div></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Orders by Status</h2></div>
        <div class="panel-body">
          <div class="chart-wrap" style="max-width:180px;margin:0 auto 20px">
            <canvas id="chart-status" height="180"></canvas>
          </div>
          <div class="status-row">
            ${[
              { key: 'shipped',   color: '#10b981', count: summary.shipped },
              { key: 'pending',   color: '#f59e0b', count: summary.pending },
              { key: 'cancelled', color: '#ef4444', count: summary.cancelled },
            ].map(s => `
              <div class="status-item">
                <span class="status-dot" style="background:${s.color}"></span>
                <span class="status-label">${s.key}</span>
                <span class="status-count">${s.count}</span>
                <span class="status-pct">${pct(s.count, total)}</span>
              </div>`).join('')}
          </div>
        </div>
      </div>
    </div>

    <!-- Top customers + Top products -->
    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h2>Top Customers</h2><span class="sub">by total spend</span></div>
        <table>
          <thead><tr><th>#</th><th>Company</th><th class="right">Orders</th><th class="right">Total Spend</th><th class="bar-cell"></th></tr></thead>
          <tbody>
            ${topCustomers.map((c, i) => `
              <tr>
                <td class="rank">${i + 1}</td>
                <td class="bold">${esc(c.company_name)}</td>
                <td class="right">${c.order_count}</td>
                <td class="right bold">${fmt(c.total_spend)}</td>
                <td class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${Math.round(c.total_spend/maxSpend*100)}%"></div></div></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Top Products</h2><span class="sub">by revenue</span></div>
        <table>
          <thead><tr><th>#</th><th>Product</th><th class="right">Sold</th><th class="right">Revenue</th></tr></thead>
          <tbody>
            ${topProducts.map((p, i) => `
              <tr>
                <td class="rank">${i + 1}</td>
                <td>${esc(p.product_name)}</td>
                <td class="right">${p.units_sold}</td>
                <td class="right bold">${fmt(p.revenue)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Revenue by category -->
    <div class="panel">
      <div class="panel-head"><h2>Revenue by Category</h2></div>
      <table>
        <thead><tr><th>Category</th><th class="right">Units Sold</th><th class="right">Revenue</th><th style="width:200px"></th></tr></thead>
        <tbody>
          ${byCategory.map(c => `
            <tr>
              <td class="bold">${esc(c.category)}</td>
              <td class="right">${c.units_sold}</td>
              <td class="right bold">${fmt(c.revenue)}</td>
              <td><div class="bar-bg"><div class="bar-fill green" style="width:${Math.round(c.revenue/maxCatRev*100)}%"></div></div></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;

  // Monthly revenue chart
  new Chart(document.getElementById('chart-monthly'), {
    type: 'bar',
    data: {
      labels: byMonth.map(m => fmtMonth(m.month)),
      datasets: [{
        label: 'Revenue',
        data: byMonth.map(m => m.revenue),
        backgroundColor: '#3b82f6',
        borderRadius: 4,
      }],
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => fmt(ctx.raw) } } },
      scales: { y: { ticks: { callback: v => '$' + v }, grid: { color: '#f0f4f8' } }, x: { grid: { display: false } } },
    },
  });

  // Status donut
  new Chart(document.getElementById('chart-status'), {
    type: 'doughnut',
    data: {
      labels: ['Shipped', 'Pending', 'Cancelled'],
      datasets: [{ data: [summary.shipped, summary.pending, summary.cancelled], backgroundColor: ['#10b981', '#f59e0b', '#ef4444'], borderWidth: 0 }],
    },
    options: {
      responsive: true,
      cutout: '70%',
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${ctx.label}: ${ctx.raw}` } } },
    },
  });
}

function pct(n, total) { return total ? Math.round(n / total * 100) + '%' : '0%'; }

load();
</script>
</body>
</html>
