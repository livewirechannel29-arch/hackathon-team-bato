version: '3.9'

services:

  # ---- Shared database — both apps read the same schema, same data ----
  db:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE:      northwind
      MYSQL_USER:          northwind
      MYSQL_PASSWORD:      northwind123
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./legacy/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "northwind", "-pnorthwind123"]
      interval: 5s
      retries: 12

  # ---- PHP 5 legacy app (the thing that currently runs production) ----
  legacy:
    image: php:5.6-apache
    volumes:
      - ./legacy:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # ---- PHP 8 modern app (install deps: docker compose run modern composer install) ----
  modern:
    image: php:8.2-cli
    command: php -S 0.0.0.0:8080 -t /app/public
    working_dir: /app
    volumes:
      - ./modern:/app
    environment:
      DB_HOST: db
      DB_NAME: northwind
      DB_USER: northwind
      DB_PASS: northwind123
    depends_on:
      db:
        condition: service_healthy

  # ---- Strangler fig proxy — the migration control plane ----
  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - legacy
      - modern
